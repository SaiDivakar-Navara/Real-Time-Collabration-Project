services:
  backend:
    build:
      context: ./backend
    container_name: collab-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: collab-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
